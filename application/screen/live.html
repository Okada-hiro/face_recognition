<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>受付アプリ</title>
  <link rel="stylesheet" href="/app-assets/styles.css">
</head>
<body class="app-live">
  <main class="live-stage">
    <section class="phone-shell live-phone-shell" aria-label="smartphone reception app">
      <div class="phone-frame">
        <div class="phone-screen demo-eyes" data-state="idle">
          <div class="status-bar">
            <span id="status-time">9:41</span>
            <span>受付AI</span>
            <span id="net-pill">接続待ち</span>
          </div>

          <div class="phone-screen-alert" id="phone-screen-alert">
            <div class="dialogue-note" id="dialogue-note" hidden>短い会話や話者不一致はここに表示されます。</div>
          </div>

          <div class="ambient ambient-left"></div>
          <div class="ambient ambient-right"></div>
          <div class="scanline"></div>

          <header class="hero">
            <div class="hero-copy">
              <p class="eyebrow">スマート受付</p>
              <h2 id="hero-title">待機中</h2>
              <p id="hero-subtitle">カメラとマイクの準備をしています。</p>
            </div>
            <div class="state-pill" id="state-pill">起動中</div>
          </header>

          <section class="avatar-zone">
            <div class="halo halo-outer"></div>
            <div class="halo halo-middle"></div>
            <div class="halo halo-inner"></div>

            <div class="assistant-face" id="assistant-face" aria-hidden="true">
              <div class="eye eye-left">
                <span class="eye-core"></span>
                <span class="eye-shine"></span>
              </div>
              <div class="eye eye-right">
                <span class="eye-core"></span>
                <span class="eye-shine"></span>
              </div>
            </div>

            <div class="orbit-text" id="orbit-text">起動中</div>
          </section>

          <section class="feed-card">
            <div class="feed-head">
              <span class="feed-title">カメラ映像</span>
              <span class="feed-badge" id="feed-badge">接続中</span>
            </div>
            <p class="feed-copy">この枠には、端末の前面カメラ映像をそのまま表示しています。</p>
            <div class="feed-body">
              <div class="feed-camera">
                <div class="camera-overlay camera-overlay-left">カメラ映像</div>
                <div class="camera-overlay camera-overlay-right" id="feed-badge-overlay">接続中</div>
                <img id="feed-image" class="feed-image" alt="annotated recognition frame">
                <video id="camera-video" class="camera-video" autoplay playsinline muted></video>
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
                <div class="target-box" id="target-box"></div>
                <div class="target-label" id="target-label">起動中…</div>
              </div>
              <div class="feed-meta">
                <div class="meta-row">
                  <span class="meta-key">対象</span>
                  <span class="meta-value" id="meta-target">未検知</span>
                </div>
                <div class="meta-row">
                  <span class="meta-key">認識</span>
                  <span class="meta-value" id="meta-identity">未認識</span>
                </div>
                <div class="meta-row">
                  <span class="meta-key">状態</span>
                  <span class="meta-value" id="meta-mode">待機中</span>
                </div>
              </div>
            </div>
          </section>

          <section class="dialogue-card">
            <div class="dialogue-head">
              <span>会話ログ</span>
              <span id="dialogue-stage">起動中</span>
            </div>
            <div class="bubble bubble-user" id="bubble-user">……</div>
            <div class="bubble bubble-ai" id="bubble-ai">受付アプリを起動しています。</div>
          </section>

          <section class="registration-card" id="registration-card" data-mode="choice" hidden>
            <div class="registration-head">
              <span id="registration-title">お名前の確認</span>
              <span class="registration-badge">顔データ</span>
            </div>
            <p class="registration-copy" id="registration-copy">はじめての方ですか？</p>

            <div class="registration-choice-actions" id="registration-choice-actions">
              <button class="live-primary-button registration-choice-button" id="registration-choice-yes" type="button">はい</button>
              <button class="registration-choice-button" id="registration-choice-existing" type="button">すでに登録済み</button>
              <button class="registration-choice-button" id="registration-choice-no" type="button">いいえ</button>
            </div>

            <form class="registration-existing-form" id="registration-existing-form" hidden>
              <label class="registration-field registration-field-full">
                <span class="registration-label">お名前（漢字）</span>
                <input
                  class="registration-input registration-input-large"
                  id="registration-existing-name"
                  name="existing_person_id"
                  type="text"
                  inputmode="text"
                  autocomplete="name"
                  placeholder="岡田寛章"
                  maxlength="64"
                >
              </label>
              <div class="registration-actions-row">
                <button class="live-primary-button registration-button" id="registration-existing-submit" type="submit">この名前で続ける</button>
                <button class="registration-secondary-button" id="registration-back-from-existing" type="button">戻る</button>
              </div>
            </form>

            <form class="registration-form" id="registration-form" hidden>
              <div class="registration-grid">
                <label class="registration-field">
                  <span class="registration-label">名字</span>
                  <input
                    class="registration-input registration-input-large"
                    id="registration-last-name"
                    name="person_last_name"
                    type="text"
                    inputmode="text"
                    autocomplete="family-name"
                    placeholder="岡田"
                    maxlength="32"
                  >
                </label>
                <label class="registration-field">
                  <span class="registration-label">名前</span>
                  <input
                    class="registration-input registration-input-large"
                    id="registration-first-name"
                    name="person_first_name"
                    type="text"
                    inputmode="text"
                    autocomplete="given-name"
                    placeholder="寛章"
                    maxlength="32"
                  >
                </label>
                <label class="registration-field">
                  <span class="registration-label">名字のふりがな</span>
                  <input
                    class="registration-input registration-input-large"
                    id="registration-last-reading"
                    name="person_last_reading"
                    type="text"
                    inputmode="kana"
                    autocomplete="off"
                    placeholder="おかだ"
                    maxlength="32"
                  >
                </label>
                <label class="registration-field">
                  <span class="registration-label">名前のふりがな</span>
                  <input
                    class="registration-input registration-input-large"
                    id="registration-first-reading"
                    name="person_first_reading"
                    type="text"
                    inputmode="kana"
                    autocomplete="off"
                    placeholder="ひろあき"
                    maxlength="32"
                  >
                </label>
              </div>
              <div class="registration-actions-row">
                <button class="live-primary-button registration-button" id="registration-submit" type="submit">この名前で登録</button>
                <button class="registration-secondary-button" id="registration-back-from-new" type="button">戻る</button>
              </div>
            </form>

            <p class="registration-status" id="registration-status"></p>
          </section>

          <div class="mini-camera-float" id="mini-camera-float" hidden>
            <video id="mini-camera-video" class="mini-camera-video" autoplay playsinline muted></video>
          </div>

          <div class="app-boot" id="app-boot">
            <div class="app-boot-card">
              <p class="eyebrow">受付アプリ</p>
              <h1>受付を開始</h1>
              <p id="boot-copy">この端末のカメラとマイクを使って受付を開始します。</p>
              <button class="live-primary-button" id="boot-start">受付を開始する</button>
              <p class="app-boot-note" id="boot-note">RunPod 上の認識・会話システムへ接続します。</p>
            </div>
          </div>

          <div class="live-debug-pill" id="live-debug-pill">接続中…</div>
          <canvas id="capture-canvas" class="capture-canvas" aria-hidden="true"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script src="/app-assets/live.js"></script>
</body>
</html>
